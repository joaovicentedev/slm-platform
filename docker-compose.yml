services:
  training:
    build:
      context: .
      args:
        UV_SYNC_ARGS: "--group training"
    command: uv run python -m training.jobs.smoke_train
    environment:
      MODEL_ARTIFACT_DIR: /artifacts
    volumes:
      - model_artifacts:/artifacts
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - .venv/
            - artifacts/
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock

  serving:
    image: ${VLLM_IMAGE:-vllm/vllm-openai-cpu:latest-arm64}
    platform: linux/arm64
    command:
      - ${VLLM_MODEL:-HuggingFaceTB/SmolLM2-135M-Instruct}
      - --served-model-name
      - ${SERVED_MODEL_NAME:-slm}
      - --dtype
      - ${VLLM_DTYPE:-float16}
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-512}
      - --kv-cache-memory-bytes
      - ${VLLM_KV_CACHE_MEMORY_BYTES:-268435456}
      - --enforce-eager
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    shm_size: 4g
    cap_add:
      - SYS_NICE
    security_opt:
      - seccomp=unconfined
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_CPU_OMP_THREADS_BIND: ${VLLM_CPU_OMP_THREADS_BIND:-auto}
    ports:
      - "8000:8000"
    volumes:
      - model_artifacts:/artifacts
      - huggingface_cache:/root/.cache/huggingface

volumes:
  model_artifacts:
  huggingface_cache:
