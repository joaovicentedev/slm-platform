[project]
name = "slm-api"
version = "0.1.0"
description = "SLM training and inference project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.99.0",
    "pydantic>=2.11.4",
    "pydantic-settings>=2.9.1",
    "pyyaml>=6.0.2",
]

[dependency-groups]
serving = [
    "httpx>=0.28.1",
]
training = [
    "accelerate>=1.6.0",
    "datasets>=3.6.0",
    "evaluate>=0.4.3",
    "numpy>=2.2.5",
    "pandas>=2.2.3",
    "peft>=0.18.0",
    "safetensors>=0.5.3",
    "scikit-learn>=1.6.1",
    "tokenizers>=0.21.1",
    "torch>=2.7.0",
    "transformers>=4.51.3",
]
aws = [
    "boto3>=1.38.8",
]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.11.8",
]

[tool.uv]
default-groups = ["dev", "serving"]
